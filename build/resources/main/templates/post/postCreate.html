<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<th:block layout:fragment="content">
    <section class="contents d-flex justify-content-center">
        <div class="w-50 py-4">
            <h1>글쓰기</h1>
            <input type="text" class="form-control" id="subject" placeholder="제목을 입력하세요.">
            <textarea class="form-control" id="content" placeholder="내용을 입력하세요" rows="10"></textarea>

            <div class="d-flex justify-content-end my-3">
                <input type="file" id="file" accept=".jpg, .gif, .png"> <!--허용하는 확장자-->
            </div>

            <div class="d-flex justify-content-between">
                <button type="button" id="postListBtn" class="btn btn-dark">목록</button>
                <div>
                    <button type="button" id="clearBtn" class="btn btn-secondary">모두 지우기</button>
                    <button type="button" id="saveBtn" class="btn btn-warning">저장</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        $(function() {
            // 목록 버튼 => 목록 화면으로 이동
            $("#postListBtn").on("click", function() {
                location.href = "/post/post-list-view";
            });

            // 모두 지우기
            $("#clearBtn").on("click", function() {
                $("#subject").val(""); // setting
                $("#content").val(""); // textarea는 val() 사용
            });

            // 글쓰기 저장
            $("#saveBtn").on("click", function() {
                let subject = $("#subject").val().trim();
                let content = $("#content").val().trim();
                let fileName = $("#file").val(); // 파일이 아닌 파일명 저장 -> ex)C:\fakepath\prairie-dog-9569847_1280.jpg
                console.log(fileName);

                if (!subject) {
                    alert("제목을 입력하세요.");
                    return;
                }

                if (!content) {
                    alert("내용을 입력하세요.");
                    return;
                }

                // 파일명이 있으면(업로드) 확장자 체크
                if (fileName) {
                    let extension = fileName.split(".").pop().toLowerCase(); // pop으로 마지막 확장자 추출(String), toLowerCase로 소문자로 일괄 변경
                    console.log(extension);
                    if ($.inArray(extension, ["jpg", "png", "gif"]) == -1) { // jquery가 제공해주는 함수인 $.inArray(비교할 String, 비교 대상 배열 값) 있으면 배열 안의 위치 0, 1로 있는 순서로 리턴 없을 경우 -1로 리턴
                        alert("이미지 파일만 업로드 할 수 있습니다.");
                        $("#file").val(""); // 파일을 비운다.
                        return;
                    }
                }
                // return; //!!!!!!!!!!!!!! 임시

                // 이미지 업로드시 form 태그 반드시 필요 => js에서 만든다
                let formData = new FormData();
                formData.append("subject", subject); // key == form 태그의 name 속성과 동일 => request param
                formData.append("content", content); // key == form 태그의 name 속성과 동일 => request param
                formData.append("file", $("#file")[0].files[0]);
                // id == file의 첫 번째(0) 안의 모든 파일 그리고 그 중 첫 번째

                $.ajax({
                    // request
                    type:"post"
                    , url:"/post/create"
                    , data:formData
                    , processData:false // 파일업로드 필수 설정
                    , contentType:false // 파일업로드 필수 설정
                    , enctype:"multipart/form-data" // 파일업로드 필수 설정

                    // response
                    , success:function(data) {
                        if (data.code == 200) {
                            alert("메모가 저장되었습니다.");
                            location.href = "/post/post-list-view";
                        } else {
                            alert(data.error_message);
                        }
                    }
                    , error:function(e) {
                        alert("글을 저장하는데 실패했습니다.")
                    }
                });
            });
        });
    </script>
</th:block>
</html>
